<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0c1222" />
      <stop offset="100%" stop-color="#080c16" />
    </linearGradient>

    <!-- Glowing Text Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#38bdf8;#818cf8;#c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Filters & Glow -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <style>
      .pulsing-orb {
        animation: pulse 6s ease-in-out infinite alternate;
      }
      .floating-card-1 {
        animation: floatA 5s ease-in-out infinite alternate;
      }
      .floating-card-2 {
        animation: floatB 6s ease-in-out infinite alternate;
      }
      .floating-card-3 {
        animation: floatC 4.5s ease-in-out infinite alternate;
      }
      .star-spin {
        transform-origin: center;
        animation: spin 12s linear infinite;
      }
      @keyframes pulse {
        0% { transform: scale(0.9) translate(0, 0); opacity: 0.35; }
        100% { transform: scale(1.15) translate(20px, -10px); opacity: 0.65; }
      }
      @keyframes floatA {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-12px); }
      }
      @keyframes floatB {
        0% { transform: translateY(0px); }
        100% { transform: translateY(10px); }
      }
      @keyframes floatC {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(-8px) rotate(-1deg); }
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="100" r="140" fill="#6366f1" opacity="0.25" filter="url(#glowCyan)" class="pulsing-orb" />
  <circle cx="950" cy="220" r="160" fill="#06b6d4" opacity="0.2" filter="url(#glowCyan)" class="pulsing-orb" style="animation-delay: -3s;" />
  <circle cx="600" cy="380" r="120" fill="#a855f7" opacity="0.18" filter="url(#glowCyan)" class="pulsing-orb" style="animation-delay: -1.5s;" />

  <!-- Decorative Tech Grid -->
  <g stroke="#334155" stroke-opacity="0.15" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Left Hero Content -->
  <g transform="translate(80, 75)">
    <!-- Tech Badge Pill -->
    <g>
      <rect x="0" y="0" width="220" height="32" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1" />
      <circle cx="16" cy="16" r="5" fill="#38bdf8">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.2">NEXT-GEN NLP ENGINE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="54" font-weight="900" fill="url(#titleGrad)" letter-spacing="-1">
      SmartReview<tspan fill="#ffffff">AI</tspan>
    </text>

    <!-- Tagline -->
    <text x="0" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Intelligent E-Commerce Customer Review Intelligence &amp; Multi-Tone NLP Platform
    </text>

    <!-- Feature Chips / Badges Row -->
    <g transform="translate(0, 168)">
      <!-- Chip 1 -->
      <rect x="0" y="0" width="145" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="14" y="21" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">⚡ Dual-Engine AI</text>

      <!-- Chip 2 -->
      <rect x="155" y="0" width="165" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="169" y="21" font-family="sans-serif" font-size="12" font-weight="600" fill="#38bdf8">🎯 7-Emotion Spectrum</text>

      <!-- Chip 3 -->
      <rect x="330" y="0" width="135" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="344" y="21" font-family="sans-serif" font-size="12" font-weight="600" fill="#34d399">📦 Vercel Ready</text>

      <!-- Chip 4 -->
      <rect x="475" y="0" width="145" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="489" y="21" font-family="sans-serif" font-size="12" font-weight="600" fill="#f472b6">📱 Android APK</text>
    </g>

    <!-- Bottom Stat Highlights -->
    <g transform="translate(0, 230)">
      <text x="0" y="16" font-family="sans-serif" font-size="24" font-weight="800" fill="#38bdf8">&lt; 2ms</text>
      <text x="0" y="34" font-family="sans-serif" font-size="11" font-weight="500" fill="#64748b">ON-DEVICE LATENCY</text>

      <text x="150" y="16" font-family="sans-serif" font-size="24" font-weight="800" fill="#34d399">88%+</text>
      <text x="150" y="34" font-family="sans-serif" font-size="11" font-weight="500" fill="#64748b">MODEL ACCURACY</text>

      <text x="290" y="16" font-family="sans-serif" font-size="24" font-weight="800" fill="#f59e0b">100%</text>
      <text x="290" y="34" font-family="sans-serif" font-size="11" font-weight="500" fill="#64748b">OFFLINE RESILIENT</text>

      <text x="430" y="16" font-family="sans-serif" font-size="24" font-weight="800" fill="#c084fc">A+ Grade</text>
      <text x="430" y="34" font-family="sans-serif" font-size="11" font-weight="500" fill="#64748b">COMPOSITE AUDIT</text>
    </g>
  </g>

  <!-- Right Floating Glassmorphism Metric Cards -->
  <g transform="translate(770, 45)">
    <!-- Card 1: Sentiment & Rating Card -->
    <g class="floating-card-1" filter="url(#softShadow)">
      <rect x="0" y="0" width="350" height="135" rx="16" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" />
      
      <!-- Card Header -->
      <rect x="18" y="16" width="90" height="22" rx="11" fill="#065f46" />
      <text x="26" y="31" font-family="sans-serif" font-size="10" font-weight="800" fill="#34d399">● POSITIVE</text>
      <text x="120" y="31" font-family="sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Confidence: <tspan fill="#34d399" font-weight="800">96.8%</tspan></text>
      
      <!-- Stars & Score -->
      <g transform="translate(18, 52)">
        <text x="0" y="24" font-family="sans-serif" font-size="28" font-weight="900" fill="url(#goldGrad)">★★★★★</text>
        <text x="145" y="24" font-family="sans-serif" font-size="18" font-weight="800" fill="#ffffff">4.9 <tspan font-size="12" fill="#64748b">/ 5.0</tspan></text>
        <rect x="220" y="6" width="95" height="22" rx="6" fill="#1e293b" />
        <text x="230" y="21" font-family="sans-serif" font-size="11" font-weight="700" fill="#fbbf24">Outstanding</text>
      </g>

      <!-- Polarity descriptor -->
      <text x="18" y="112" font-family="sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Polarity: <tspan fill="#38bdf8" font-weight="700">Strongly Positive</tspan> • Tone: <tspan fill="#f472b6" font-weight="700">Joyful</tspan></text>
    </g>

    <!-- Card 2: Multi-Emotion Mini Gauge -->
    <g transform="translate(25, 150)" class="floating-card-2" filter="url(#softShadow)">
      <rect x="0" y="0" width="340" height="100" rx="14" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.3" />
      
      <text x="18" y="24" font-family="sans-serif" font-size="11" font-weight="800" fill="#818cf8" letter-spacing="1">7-TONE EMOTION SPECTRUM</text>
      
      <!-- Emotion Bar 1: Joy -->
      <g transform="translate(18, 36)">
        <text x="0" y="10" font-family="sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Joy</text>
        <rect x="50" y="2" width="190" height="8" rx="4" fill="#1e293b" />
        <rect x="50" y="2" width="170" height="8" rx="4" fill="#34d399" />
        <text x="250" y="10" font-family="sans-serif" font-size="10" font-weight="700" fill="#34d399">89%</text>
      </g>

      <!-- Emotion Bar 2: Surprise -->
      <g transform="translate(18, 56)">
        <text x="0" y="10" font-family="sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Surprise</text>
        <rect x="50" y="2" width="190" height="8" rx="4" fill="#1e293b" />
        <rect x="50" y="2" width="115" height="8" rx="4" fill="#38bdf8" />
        <text x="250" y="10" font-family="sans-serif" font-size="10" font-weight="700" fill="#38bdf8">61%</text>
      </g>

      <!-- Emotion Bar 3: Love -->
      <g transform="translate(18, 76)">
        <text x="0" y="10" font-family="sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Love</text>
        <rect x="50" y="2" width="190" height="8" rx="4" fill="#1e293b" />
        <rect x="50" y="2" width="145" height="8" rx="4" fill="#ec4899" />
        <text x="250" y="10" font-family="sans-serif" font-size="10" font-weight="700" fill="#ec4899">76%</text>
      </g>
    </g>

    <!-- Card 3: Actionable Recommendation Pill -->
    <g transform="translate(-10, 265)" class="floating-card-3" filter="url(#softShadow)">
      <rect x="0" y="0" width="360" height="58" rx="12" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="1.2" stroke-opacity="0.3" />
      <circle cx="28" cy="29" r="14" fill="#831843" />
      <text x="22" y="34" font-family="sans-serif" font-size="14">💡</text>
      <text x="52" y="24" font-family="sans-serif" font-size="11" font-weight="800" fill="#f472b6">AI ACTION ITEM • <tspan fill="#fbbf24">PRIORITY: HIGH</tspan></text>
      <text x="52" y="42" font-family="sans-serif" font-size="11" font-weight="500" fill="#cbd5e1">Optimize fast charging &amp; reinforce packaging</text>
    </g>
  </g>
</svg>
